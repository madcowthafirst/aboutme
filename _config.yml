# about_title: About Me
about_profile_image: images/profile.jpg
about_content: | # this will include new lines to allow paragraphs
  Mijn naam is Marco Ensing. Ik ben een sociale collega met een professionele, kritische en pragmatische instelling.
  Waar ik energie van krijg: een ingewikkeld technisch probleem doorgronden en tot een goede oplossing brengen.
  Een gezellige werkomgeving en een persoonlijke aanpak zijn voor mij minstens zo belangrijk als de techniek zelf.

  In mijn huidige rol als Senior DevOps Engineer beheer en verbeter ik Kubernetes-omgevingen op AWS en ondersteun ik de ontwikkelteams. Dat loopt van het uitrollen van de infrastructuur tot het deployen van de bijbehorende middleware en de Java-containers die samen onze applicatiestack vormen.
    
  Daarvoor werkte ik met Terraform en Ansible voor het onderhouden en supporten van WSO2 omgevingen op AWS.
  En daar weer voor kwam ik uit de IBM-hoek: IBM Connections en het bijbehorende WebSphere-ecosysteem (Sametime, WebSphere Portal, WebSphere Application Server, DB2, IBM MQ).

  Dagelijkse toolset:  vi, jenkins, Terraform, argocd, groovy, java, bash, jira, confluence.
content:
  - title: Projects # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: top-middle
        title: Instructure as Code
        link: github.com/sproogen
        # link_text: Project Website
        additional_links:
          # - title:  Github page for project (eg. sproogen/modern-resume-theme)
          #   icon: fab fa-github
          #   url: Link to project (eg. sproogen.github.io/modern-resume-theme)
        quote: >
          Van niks naar een full deploy met 1 Jenkins pipeline
        description: | # this will include new lines to allow paragraphs
          Een volledige Infrastructure-as-Code-opzet gebouwd waarbij één Jenkins-pipeline via Terraform een AWS EKS-cluster opbouwt, inclusief automatische deploy van alle benodigde middleware. Daarbovenop worden de Java-containers uitgerold die samen onze SureSync Connect-applicatie extern bereikbaar maken.

          De pipeline is zo solide gemaakt dat hij 's ochtends gescheduled draait — een uur later staat de omgeving live. 's Avonds rond zeven uur draait een terraform destroy die alles opruimt, waarbij data veilig wordt gesteld en 's ochtends als restorepunt dient bij het opbouwen.

          Resultaat: maximaal in control, alles afgedwongen in IaC, en disaster recovery zit letterlijk in de dagelijkse routine.

          Stack: Jenkins, Groovy, Terraform, AWS (EKS), ArgoCD, Bash.

  - title: Ervaringen # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: SureSync ( voorheen Visma Connect B.V. / EBPI )
        link: suresync.nl
        # link_text: boringcompany.com
        sub_title: Senior DevOps Engineer
        caption: 2018
        quote: >
          DevOps to the Max
        description: | # this will include new lines to allow paragraphs
          1) Begonnen als IBM technisch specialist in een grootschalig migratietraject waarbij overheidsapplicaties zoals Digipoort en de backend van de Berichtenbox naar modernere middleware zijn gebracht. Grote omgevingen, high-availability-eisen, in totaal negen omgevingen. Uitrol zoveel mogelijk geautomatiseerd via Ansible en XLdeploy om één universele deploy-methode af te dwingen.
          2) Meegegroeid met AWS en overgestapt naar een team dat WSO2-oplossingen infrastructureel via geautomatiseerde processen uitrolt, voornamelijk met Jenkins en Terraform.
          3) Senior in het team dat het SureSync Connect-platform bouwt en beheert. Betrokken bij bouw, onderhoud en verbeteringen op het vlak van security, kosten en dynamisch opschalen bij hogere load.

      - layout: left
        title: Virtual Science ( onderdeel van Conclusion )
